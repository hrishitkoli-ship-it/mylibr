<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MyLibrary — 100% offline personal PDF library and reader.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MyLibrary">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>MyLibrary</title>
  <link rel="manifest" href="manifest.json">

  <!--
    pdf.js: local PDF rendering + text extraction, entirely client-side.
    Served from the app's own asset bundle at deploy time (copy the
    pdf.js dist build into web/pdfjs/ before shipping) — no runtime
    dependency on a CDN once deployed. During development, cdnjs is
    used for convenience; see docs/SETUP.md for the offline-asset step.
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.js';
  </script>
  <script src="pdf_bridge.js"></script>
  <script src="tts_bridge.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
