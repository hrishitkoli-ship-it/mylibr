name: mylibr
description: 100% offline personal PDF library & reader (Flutter Web), browser-local storage only.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database — IndexedDB-backed on web via sembast_web.
  # No server, no sync — purely browser-local persistence.
  sembast: ^3.7.2
  sembast_web: ^2.2.2

  # uuid for local record ids
  uuid: ^4.4.0

  # File pickers — both have first-class web implementations that use
  # the browser's native file input / gallery picker, no upload step.
  file_picker: ^8.0.6
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8
  js: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
