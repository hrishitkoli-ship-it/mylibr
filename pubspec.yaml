name: mylibr
description: 100% offline personal PDF library & reader with on-device TTS.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database (ObjectBox chosen for speed + offline-first, zero-cost)
  objectbox: ^4.0.1
  objectbox_flutter_libs: ^4.0.1

  # File system access (sandboxed app directory)
  path_provider: ^2.1.3
  path: ^1.9.0

  # File picking (import PDFs, pick custom cover images)
  file_picker: ^8.0.6
  image_picker: ^1.1.2

  # PDF rendering (page-1 raster for cover, page navigation)
  pdfx: ^2.6.0

  # PDF text extraction (for TTS)
  syncfusion_flutter_pdf: ^26.2.14

  # Native on-device TTS — zero cost, no cloud
  flutter_tts: ^4.0.2

  # UUIDs for local record IDs
  uuid: ^4.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  objectbox_generator: ^4.0.1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
